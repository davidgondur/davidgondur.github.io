project:
  type: website
  resources:
    - assets/documents/
  # Fija el botón de idioma y añade las etiquetas hreflang en el HTML generado.
  post-render: scripts/i18n.ts

lang: es

website:
  title: "David González Durán"
  site-url: https://davidgondur.github.io
  navbar:
    right:
      # Botón de cambio de idioma. scripts/i18n.ts sustituye este enlace por
      # el de la página equivalente en el otro idioma.
      - text: "EN"
        href: "#lang-toggle"

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
